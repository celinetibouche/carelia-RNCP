services:
  frontend:
    build:
      context: ./frontend
      target: development
    # Resynchronise les volumes node_modules persistants avec package-lock.json.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  users:
    build:
      context: ./backend
      target: development
    image: carelia/users-api:development
    command: sh -c "npm ci && npm run dev"
    environment:
      NODE_ENV: development
      SERVICE_NAME: carelia-users-api
      PORT: 4001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: mysql://${MYSQL_USER:-carelia}:${MYSQL_PASSWORD:-carelia_dev}@db:3306/${MYSQL_DATABASE:-carelia}
    ports:
      - "${USERS_PORT:-4001}:4001"
    volumes:
      - ./backend:/app
      - users_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  daycares:
    build:
      context: ./backend
      target: development
    image: carelia/daycares-api:development
    command: sh -c "npm ci && npm run dev"
