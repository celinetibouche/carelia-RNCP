  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-carelia}
      MYSQL_USER: ${MYSQL_USER:-carelia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-carelia_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-carelia_root_dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - carelia_mysql_data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-carelia_root_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  frontend_node_modules:
  users_node_modules:
  daycares_node_modules:
  diaper_changes_node_modules:
  moods_node_modules:
  naps_node_modules:
  carelia_mysql_data:
