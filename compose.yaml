      DATABASE_URL: mysql://${MYSQL_USER:-carelia}:${MYSQL_PASSWORD:-carelia_dev}@db:3306/${MYSQL_DATABASE:-carelia}
    ports:
      - "${DAYCARES_PORT:-4002}:4002"
    volumes:
